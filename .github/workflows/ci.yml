name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven and browser verification (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Falling back to the newest earlier cache keeps every artifact a dependency bump did not
      # change, where an exact match on the POM would start from an empty repository.
      - name: Restore the Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # verify runs the unit suites and then the stdio end-to-end test against the packaged jar.
      # That test is the one that catches a shading, resource or dependency-resolution break, which
      # is what a dependency bump risks.
      - name: Run Maven verification
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Use Node 24 for the browser gate
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: browser/package-lock.json

      - name: Install browser tools and engines
        working-directory: browser
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: Exercise the packaged session page in three browsers
        working-directory: browser
        env:
          CEDAR_TEST_WORKERS: '2'
        run: npm test

      - name: Keep browser results and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: session-browser-results
          path: browser/reports
          if-no-files-found: ignore
