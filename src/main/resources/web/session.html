<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CEDAR</title>
  <!-- The shared CEDAR design tokens, vendored and served by cedar-cee-mcp like the CEE bundle. -->
  <link rel="stylesheet" href="/vendor/cedar-design-tokens/custom-properties.css">
  <link rel="stylesheet" href="/vendor/cedar-design-tokens/secondary-action.css">
  <style>
    body {
      margin: 0;
      font-family: var(--cedar-font-family);
      font-size: var(--cedar-font-size);
      color: var(--cedar-text-primary);
      background: var(--cedar-surface-raised);
    }
    .session-bar {
      position: sticky;
      top: 0;
      z-index: var(--cedar-layer-sticky);
      display: flex;
      align-items: center;
      gap: var(--cedar-space-4);
      padding: var(--cedar-space-2) var(--cedar-space-4);
      background: var(--cedar-color-primary);
      color: var(--cedar-color-on-primary);
    }
    .session-title {
      flex: 1;
      font-size: var(--cedar-font-size-large);
      font-weight: var(--cedar-font-weight-medium);
      line-height: var(--cedar-line-height-heading);
    }
    /* The shared ring is drawn in the primary colour, which the bar itself is painted in. */
    .session-bar :focus-visible {
      outline-color: var(--cedar-color-on-primary);
    }
    #status {
      padding: var(--cedar-space-2) var(--cedar-space-4);
      color: var(--cedar-text-muted);
    }
    #status.error {
      color: var(--cedar-status-error-text);
      font-weight: var(--cedar-font-weight-medium);
    }
    #editor {
      padding: 0 var(--cedar-space-4) var(--cedar-space-6);
    }
  </style>
</head>
<body>
<header class="session-bar">
  <span class="session-title" id="title">CEDAR</span>
  <button class="cedar-secondary-action" id="done" hidden>Done &mdash; return to chat</button>
</header>
<div id="status">Loading the CEDAR Embeddable Editor&hellip;</div>
<div id="editor">
  <cedar-embeddable-editor></cedar-embeddable-editor>
</div>

<script>
  // The pinned CEE web-component bundle is served by cedar-cee-mcp out of its own jar, so nothing
  // here depends on a CDN at runtime.
  const CEE_BUNDLE = '/cee/cedar-embeddable-editor.js';

  const sessionId = location.pathname.split('/')[2];
  const statusEl = document.getElementById('status');
  const doneButton = document.getElementById('done');

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = isError ? 'error' : '';
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error('failed to load ' + src));
      document.head.appendChild(s);
    });
  }

  async function boot() {
    // This page only works served by cedar-cee-mcp at /s/<session-id>; opened standalone
    // (file preview, double-click) there is no session and no server to talk to.
    if (!location.protocol.startsWith('http') || !location.pathname.startsWith('/s/') || !sessionId) {
      setStatus('This page is served by cedar-cee-mcp and cannot run standalone — open it '
        + 'through a show_template, show_instance, or fill_instance tool call.', true);
      return;
    }

    try {
      await loadScript(CEE_BUNDLE);
    } catch (bundleError) {
      setStatus('Could not load the CEE bundle from cedar-cee-mcp. Reload this page; if it '
        + 'persists the server was built without the bundle staged.', true);
      return;
    }

    await customElements.whenDefined('cedar-embeddable-editor');

    const response = await fetch('/s/' + sessionId + '/data');
    if (!response.ok) {
      setStatus('Could not fetch session data: HTTP ' + response.status, true);
      return;
    }
    const data = await response.json();

    const templateName = (data.templateObject && data.templateObject['schema:name']) || 'CEDAR artifact';
    document.title = templateName;
    document.getElementById('title').textContent = templateName;

    const cee = document.querySelector('cedar-embeddable-editor');

    // Assigned before the configuration it concerns: CEE injects the handler when this input is
    // set, so a handler set afterwards never hears what the configuration reported. Reports do
    // not change what the editor does — an unknown key is ignored either way — so they are
    // counted here and detailed in the console rather than replacing the mode's status line.
    const problems = [];
    cee.eventHandler = {
      error: (label, value) => {
        problems.push(label);
        console.error('CEE: ' + label, value);
      },
      trace: (label, value) => console.debug('CEE: ' + label, value)
    };

    cee.config = data.config;
    if (data.instanceObject) {
      cee.templateAndInstanceObject = {
        templateObject: data.templateObject,
        instanceObject: data.instanceObject
      };
    } else {
      cee.templateObject = data.templateObject;
    }

    let status;
    if (data.mode === 'FILL') {
      doneButton.hidden = false;
      status = 'Fill in the form, then press "Done" to send the metadata back to the chat.';
    } else if (data.mode === 'VIEW_INSTANCE') {
      status = 'Read-only view of a metadata instance.';
    } else {
      status = 'Read-only view of a template.';
    }
    if (problems.length) {
      status += ' CEE reported ' + problems.length + ' problem'
        + (problems.length === 1 ? '' : 's') + ' with what it was handed — see the browser console.';
    }
    setStatus(status, problems.length > 0);
  }

  doneButton.addEventListener('click', async () => {
    const cee = document.querySelector('cedar-embeddable-editor');
    const metadata = cee.currentMetadata;
    if (!metadata) {
      setStatus('The editor returned no metadata to submit.', true);
      return;
    }
    doneButton.disabled = true;
    try {
      const response = await fetch('/s/' + sessionId + '/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(metadata)
      });
      if (response.ok) {
        setStatus('Metadata sent back to the chat. You can close this tab — or edit further '
          + 'and press Done again to replace it.');
      } else {
        setStatus('Submit failed: HTTP ' + response.status + ' ' + (await response.text()), true);
      }
    } catch (e) {
      setStatus('Submit failed: ' + e.message, true);
    } finally {
      doneButton.disabled = false;
    }
  });

  boot().catch(e => setStatus('Failed to initialize: ' + e.message, true));
</script>
</body>
</html>
